server {
    listen 80 default_server;
    server_name _;

    root /var/www/slavyanochka;
    index index.html;
    charset utf-8;

    # Браузер каждый раз спрашивает сервер, не поменялось ли что-то.
    # Если не поменялось, сервер отвечает коротко 304 и берётся копия из кэша,
    # если поменялось, сразу отдаётся новая версия. Так ничего не залипает.
    add_header Cache-Control "no-cache, must-revalidate" always;
    etag on;

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript;
}
