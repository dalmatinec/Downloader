# Порт 80: отдаём проверку для Let's Encrypt, всё остальное отправляем на https
server {
    listen 80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/slavyanochka;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/SERVER_IP/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SERVER_IP/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/slavyanochka;
    index index.html;
    charset utf-8;

    # Браузер каждый раз сверяется с сервером, поэтому новая версия видна сразу
    add_header Cache-Control "no-cache, must-revalidate" always;
    etag on;

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript;
}
